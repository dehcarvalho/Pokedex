<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pokédex</h1>
        <p>Explore o mundo dos Pokémon!</p>
    </header>

    <main>
        <div class="busca">
            <input 
                type="text" 
                id="campoBusca" 
                placeholder="Digite o nome de um Pokémon..."
            >

            <button id="botaoBuscar">Buscar</button>
        </div>

        <div id="listaPokemon"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
